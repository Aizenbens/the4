<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُدير المصاريف الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .switch-link span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
        }

        .dashboard {
            max-width: 800px;
        }

        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logout-btn {
            width: auto;
            padding: 6px 15px;
            background-color: var(--danger);
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f9fafb;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #f3f4f6;
        }

        .stat-card h4 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .stat-income { color: var(--success); }
        .stat-expense { color: var(--danger); }
        .stat-balance { color: var(--primary); }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .items-list {
            margin-top: 25px;
            max-height: 250px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .item-row.income-border { border-right: 4px solid var(--success); }
        .item-row.expense-border { border-right: 4px solid var(--danger); }

        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; }
        .item-cost { font-size: 0.9rem; color: var(--text-muted); }

        .delete-btn {
            background: none;
            color: var(--danger);
            border: none;
            width: auto;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .delete-btn:hover { background: #fee2e2; border-radius: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="authCard" class="container">
        <h2 id="authTitle">تسجيل الدخول</h2>
        <form id="authForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="authBtn">دخول</button>
        </form>
        <div class="switch-link">
            <span id="switchAuth">ليس لديك حساب؟ سجل الآن</span>
        </div>
    </div>

    <div id="dashboardCard" class="container dashboard hidden">
        <div class="header-dash">
            <h2>مُدير المصاريف الذكي</h2>
            <button class="logout-btn" id="logoutBtn">خروج</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>الدخل</h4>
                <p class="stat-income" id="totalIncome">0.00 ر.س</p>
            </div>
            <div class="stat-card">
                <h4>المصاريف</h4>
                <p class="stat-expense" id="totalExpenses">0.00 ر.س</p>
            </div>
            <div class="stat-card">
                <h4>الرصيد</h4>
                <p class="stat-balance" id="netBalance">0.00 ر.س</p>
            </div>
        </div>

        <form id="transactionForm">
            <div class="row">
                <div class="form-group">
                    <label for="transName">البيان / الوصف</label>
                    <input type="text" id="transName" required placeholder="مثال: راتب، بقالة...">
                </div>
                <div class="form-group">
                    <label for="transAmount">المبلغ</label>
                    <input type="number" id="transAmount" step="0.01" required placeholder="0.00">
                </div>
            </div>
            <div class="form-group">
                <label for="transType">نوع المعاملة</label>
                <select id="transType">
                    <option value="income">دخل (+)</option>
                    <option value="expense">مصروف (-)</option>
                </select>
            </div>
            <button type="submit">إضافة المعاملة</button>
        </form>

        <div class="items-list" id="transactionsList"></div>
    </div>
