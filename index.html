<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المصاريف والغرف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body.dark-mode {
            --background: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background 0.2s;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        h2, h3 { text-align: center; margin-bottom: 20px; color: var(--primary); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }
        .btn-secondary { background: #64748b; }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-success { background: var(--success); }

        .room-bar {
            background: rgba(79, 70, 229, 0.08);
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .income-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--success);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .progress-bar-container {
            background: var(--border);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            background: var(--danger);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(0,0,0,0.02);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-card h4 { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-card p { font-size: 1.1rem; font-weight: 700; }

        .stat-income { color: var(--success); }
        .stat-expense { color: var(--danger); }
        .stat-balance { color: var(--primary); }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .section-title {
            font-size: 0.95rem;
            margin: 18px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .items-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(0,0,0,0.02);
            border-radius: 8px;
            margin-bottom: 8px;
            border-right: 4px solid var(--danger);
        }

        .item-row.pending-border { border-right-color: var(--warning); }

        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 0.9rem; }
        .item-meta { font-size: 0.75rem; color: var(--text-muted); }

        .archive-card {
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="authCard" class="container">
        <h2>الدخول للغرفة</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>الاسم الشخصي</label>
                <input type="text" id="username" required placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
                <label>الكود الخصوصي (رمز الدخول)</label>
                <input type="password" id="usercode" required placeholder="أدخل رمز سري خاص بك">
            </div>
            <div class="form-group">
                <label>رمز الغرفة (اختياري)</label>
                <input type="text" id="roomIdInput" placeholder="أتركه فارغاً لإنشاء غرفة جديدة">
            </div>
            <button type="submit">دخول إلى الغرفة</button>
        </form>
    </div>

    <div id="dashboardCard" class="container hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-weight:bold;">مدير المصاريف الذكي</span>
            <div>
                <button id="themeToggleBtn" class="btn-secondary" style="width:auto; padding:5px 10px; font-size:0.8rem;">🌙</button>
                <button id="logoutBtn" class="btn-danger" style="width:auto; padding:5px 10px; font-size:0.8rem;">خروج</button>
            </div>
        </div>

        <div class="room-bar">
            رمز الغرفة: <strong id="currentRoomDisplay" style="color:var(--primary);"></strong><br>
            <button id="copyLinkBtn" class="btn-warning" style="margin-top:8px; padding:4px 8px; font-size:0.8rem; width:auto;">📋 نسخ رابط الغرفة المباشر</button>
        </div>

        <div class="income-box">
            <label style="font-size:0.85rem; font-weight:bold; color:var(--success);">💰 تحديد/تعديل الميزانية الإجمالية للشهر</label>
            <form id="incomeForm" style="display:flex; gap:8px; margin-top:6px;">
                <input type="number" id="incomeInput" step="0.01" placeholder="أدخل قيمة الدخل/الميزانية" required style="padding:8px; border:1px solid var(--border); border-radius:6px; width:100%;">
                <button type="submit" class="btn-success" style="width:auto; padding:8px 15px; font-size:0.85rem; white-space:nowrap;">حفظ الميزانية</button>
            </form>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>الميزانية الكلية</h4>
                <p class="stat-income" id="totalIncome">0</p>
            </div>
            <div class="stat-card">
                <h4>المصاريف</h4>
                <p class="stat-expense" id="totalExpenses">0</p>
            </div>
            <div class="stat-card">
                <h4>المتبقي</h4>
                <p class="stat-balance" id="netBalance">0</p>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
                <span>نسبة استهلاك الميزانية:</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <h3 class="section-title">إضافة مصروف جديد</h3>
        <form id="expenseForm">
            <div class="row">
                <div class="form-group">
                    <label>اسم المصروف / الشراء</label>
                    <input type="text" id="expenseName" required placeholder="مثال: بقالة، فواتير">
                </div>
                <div class="form-group">
                    <label>المبلغ (ر.س)</label>
                    <input type="number" id="expenseAmount" step="0.01" required placeholder="0.00">
                </div>
            </div>
            <button type="submit">إضافة إلى المصاريف</button>
        </form>

        <h3 class="section-title">طلب شراء جديد (بدون سعر)</h3>
        <form id="purchaseRequestForm" class="row">
            <input type="text" id="reqItemName" required placeholder="اسم الشيء المطلوب شراءه" style="padding:10px; border:1px solid var(--border); border-radius:8px;">
            <button type="submit" class="btn-warning">إرسال الطلب</button>
        </form>
        <div class="items-list" id="requestsList"></div>

        <div class="section-title">
            <span>سجل مصاريف الشهر الحالي (<span id="itemCount">0</span>)</span>
            <button id="archiveMonthBtn" class="btn-secondary" style="width:auto; padding:4px 8px; font-size:0.75rem;">📦 أرشفة وبدء شهر جديد</button>
        </div>
        <div class="items-list" id="transactionsList"></div>

        <h3 class="section-title">أرشيف الأشهر السابقة</h3>
        <div id="archivesList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://the-713f0-default-rtdb.firebaseio.com",
            projectId: "the-713f0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = "";
        let currentRoomId = "";

        // فحص الرابط المباشر
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomFromUrl = urlParams.get('room');
            if (roomFromUrl) document.getElementById('roomIdInput').value = roomFromUrl;
        });

        // الوضع الداكن
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });

        // التسجيل والدخول
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const usercode = document.getElementById('usercode').value.trim();
            let roomId = document.getElementById('roomIdInput').value.trim();

            if (!username || !usercode) return alert("يرجى إدخال الاسم والكود");

            currentUser = `${username} (${usercode})`;
            if (!roomId) roomId = 'room_' + Math.random().toString(36).substr(2, 6);
            currentRoomId = roomId;

            document.getElementById('currentRoomDisplay').innerText = currentRoomId;
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('dashboardCard').classList.remove('hidden');

            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + currentRoomId;
            window.history.pushState({path: newUrl}, '', newUrl);

            loadRoomData();
        });

        // نسخ الرابط المباشر
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href);
            alert("تم نسخ رابط الغرفة المباشر بنجاح!");
        });

        document.getElementById('logoutBtn').addEventListener('click', () => location.href = window.location.pathname);

        function getDateFormatted() {
            return new Date().toLocaleDateString('ar-SA', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // حفظ الميزانية / الدخل الكلي
        document.getElementById('incomeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const budgetVal = parseFloat(document.getElementById('incomeInput').value);
            set(ref(db, `rooms/${currentRoomId}/budget`), budgetVal);
            document.getElementById('incomeInput').value = '';
        });

        // إضافة مصروف
        document.getElementById('expenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('expenseName').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);

            push(ref(db, `rooms/${currentRoomId}/current_month`), {
                name, amount, author: currentUser, date: getDateFormatted()
            });

            document.getElementById('expenseForm').reset();
        });

        // طلب شراء
        document.getElementById('purchaseRequestForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const itemName = document.getElementById('reqItemName').value;

            push(ref(db, `rooms/${currentRoomId}/requests`), {
                itemName, requester: currentUser, date: getDateFormatted()
            });

            document.getElementById('purchaseRequestForm').reset();
        });

        // أرشفة الشهر وبدء شهر جديد
        document.getElementById('archiveMonthBtn').addEventListener('click', () => {
            const monthName = prompt("أدخل اسماً لهذا الشهر المؤرشف (مثال: شهر 7):");
            if (!monthName) return;

            onValue(ref(db, `rooms/${currentRoomId}`), (snapshot) => {
                const roomData = snapshot.val();
                const expensesData = roomData ? roomData.current_month : null;
                const budget = roomData ? (roomData.budget || 0) : 0;

                let expenseSum = 0;
                if (expensesData) {
                    Object.values(expensesData).forEach(item => expenseSum += item.amount);
                }

                push(ref(db, `rooms/${currentRoomId}/archives`), {
                    monthName,
                    incomeSum: budget,
                    expenseSum,
                    netBalance: budget - expenseSum,
                    items: expensesData || {},
                    archivedAt: getDateFormatted()
                }).then(() => {
                    set(ref(db, `rooms/${currentRoomId}/current_month`), null);
                    alert("تمت أرشفة الشهر بنجاح!");
                });
            }, { onlyOnce: true });
        });

        // تحميل بيانات الغرفة
        function loadRoomData() {
            // جلب الميزانية المحددة
            onValue(ref(db, `rooms/${currentRoomId}/budget`), (snapshot) => {
                const budget = snapshot.val() || 0;
                document.getElementById('totalIncome').innerText = budget.toFixed(2);
                calculateTotals(budget);
            });

            // جلب سجل المصاريف
            onValue(ref(db, `rooms/${currentRoomId}/current_month`), (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('transactionsList');
                list.innerHTML = '';
                let expenseSum = 0;
                let count = 0;

                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        expenseSum += item.amount;
                        count++;

                        const row = document.createElement('div');
                        row.className = "item-row";
                        row.innerHTML = `
                            <div class="item-info">
                                <span class="item-name">${item.name}</span>
                                <span class="item-meta">${item.author} | 🗓️ ${item.date}</span>
                            </div>
                            <div>
                                <span style="font-weight:bold; margin-left:8px;">-${item.amount.toFixed(2)}</span>
                                <button onclick="deleteItem('current_month', '${key}')" class="btn-danger" style="padding:2px 6px; font-size:0.75rem; width:auto;">X</button>
                            </div>
                        `;
                        list.appendChild(row);
                    });
                }
                
                document.getElementById('itemCount').innerText = count;
                document.getElementById('totalExpenses').innerText = expenseSum.toFixed(2);
                
                // إعادة احتساب الصافي بناءً على الدخل المسجل
                const currentBudget = parseFloat(document.getElementById('totalIncome').innerText) || 0;
                calculateTotals(currentBudget, expenseSum);
            });

            // طلبات الشراء
            onValue(ref(db, `rooms/${currentRoomId}/requests`), (snapshot) => {
                const data = snapshot.val();
                const reqList = document.getElementById('requestsList');
                reqList.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(key => {
                        const req = data[key];
                        const row = document.createElement('div');
                        row.className = "item-row pending-border";
                        row.innerHTML = `
                            <div class="item-info">
                                <span class="item-name">🛍️ ${req.itemName}</span>
                                <span class="item-meta">طَلَب: ${req.requester} | 🗓️ ${req.date}</span>
                            </div>
                            <div style="display:flex; gap:4px;">
                                <button onclick="approveRequest('${key}', '${req.itemName}')" class="btn-success" style="padding:3px 6px; font-size:0.75rem; width:auto;">تأكيد بالسعر</button>
                                <button onclick="deleteItem('requests', '${key}')" class="btn-danger" style="padding:3px 6px; font-size:0.75rem; width:auto;">X</button>
                            </div>
                        `;
                        reqList.appendChild(row);
                    });
                }
            });

            // سجل الأرشيف
            onValue(ref(db, `rooms/${currentRoomId}/archives`), (snapshot) => {
                const data = snapshot.val();
                const archivesList = document.getElementById('archivesList');
                archivesList.innerHTML = '';

                if (data) {
                    Object.keys(data).forEach(key => {
                        const arc = data[key];
                        const div = document.createElement('div');
                        div.className = "archive-card";
                        div.innerHTML = `
                            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:5px;">
                                <span>📅 ${arc.monthName}</span>
                                <button onclick="toggleArchiveDetails('${key}')" class="btn-secondary" style="padding:2px 8px; font-size:0.75rem; width:auto;">👁️ عرض المشتريات</button>
                            </div>
                            <div style="font-size:0.8rem; color:var(--text-muted); display:flex; gap:10px;">
                                <span>الميزانية: <strong style="color:var(--success)">${arc.incomeSum.toFixed(2)}</strong></span>
                                <span>المصروفات: <strong style="color:var(--danger)">${arc.expenseSum.toFixed(2)}</strong></span>
                                <span>المتبقي: <strong style="color:var(--primary)">${arc.netBalance.toFixed(2)}</strong></span>
                            </div>
                            <div id="details-${key}" class="items-list hidden" style="margin-top:8px; border-top:1px dashed var(--border); padding-top:5px;"></div>
                        `;

                        archivesList.appendChild(div);

                        const detailsDiv = div.querySelector(`#details-${key}`);
                        if (arc.items) {
                            Object.values(arc.items).forEach(item => {
                                const itemRow = document.createElement('div');
                                itemRow.style.fontSize = "0.8rem";
                                itemRow.style.padding = "4px 0";
                                itemRow.style.borderBottom = "1px solid var(--border)";
                                itemRow.innerHTML = `• <strong>${item.name}</strong>: ${item.amount.toFixed(2)} ر.س (${item.author})`;
                                detailsDiv.appendChild(itemRow);
                            });
                        }
                    });
                } else {
                    archivesList.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem;">لا توجد أشهر مؤرشفة بعد.</p>';
                }
            });
        }

        function calculateTotals(budget, expenseSum = null) {
            if (expenseSum === null) {
                expenseSum = parseFloat(document.getElementById('totalExpenses').innerText) || 0;
            }
            const net = budget - expenseSum;
            document.getElementById('netBalance').innerText = net.toFixed(2);

            // تحديث نسبة الشريط Progress Bar
            let percent = budget > 0 ? (expenseSum / budget) * 100 : 0;
            percent = Math.min(percent, 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = percent.toFixed(1) + '%';
        }

        // الدوال العالمية
        window.deleteItem = (path, key) => remove(ref(db, `rooms/${currentRoomId}/${path}/${key}`));

        window.approveRequest = (key, itemName) => {
            const price = prompt(`أدخل السعر لشراء (${itemName}):`);
            if (price && !isNaN(price)) {
                push(ref(db, `rooms/${currentRoomId}/current_month`), {
                    name: `شراء طلب: ${itemName}`,
                    amount: parseFloat(price),
                    author: currentUser,
                    date: getDateFormatted()
                });
                remove(ref(db, `rooms/${currentRoomId}/requests/${key}`));
            }
        };

        window.toggleArchiveDetails = (key) => {
            const target = document.getElementById(`details-${key}`);
            target.classList.toggle('hidden');
        };
    </script>
</body>
</html>
